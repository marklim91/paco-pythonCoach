name: Test and deploy static report

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'deployment' }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test

  build:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Assemble site from public/ (no Node build, no data export)
        run: |
          mkdir _site
          cp -r public/. _site/
          touch _site/.nojekyll
      - name: Inject the points flow address from the POINTS_FLOW_URL secret
        env:
          POINTS_FLOW_URL: ${{ secrets.POINTS_FLOW_URL }}
        run: |
          node -e 'require("fs").writeFileSync("_site/runtime-config.js", "window.PcoConfig = " + JSON.stringify({ pointsUrl: process.env.POINTS_FLOW_URL || "" }) + ";\n")'
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Check published login page and browser-side API
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          base="${PAGES_URL%/}/"
          for attempt in 1 2 3 4 5; do
            ok=1
            for file in login.html local-api.js new.html runtime-config.js; do
              code=$(curl -s -o /dev/null -w '%{http_code}' "${base}${file}?t=${RANDOM}") || code=000
              [ "$code" = "200" ] || ok=0
            done
            if [ "$ok" = 1 ] && ! curl -s "${base}login.html?t=${RANDOM}" | grep -q 'site-mode.js'; then
              echo "Published pages are reachable and not in static snapshot mode."
              exit 0
            fi
            sleep 10
          done
          echo "::error::Published login page, local-api.js or new.html is not reachable as expected."
          exit 1
