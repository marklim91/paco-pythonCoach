<!doctype html>
<html lang="ko" data-pco-skin="studio" data-pco-theme-ui="page">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="./theme.js"></script>
    <meta name="theme-color" content="#f6f7f9" />
    <link rel="manifest" href="./manifest.json" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <script>
      if ("serviceWorker" in navigator)
        window.addEventListener("load", () =>
          navigator.serviceWorker.register("./sw.js").catch(() => {}),
        );
    </script>
    <title>파코 스튜디오 · 나의 첫 Python</title>
    <script src="./runtime-config.js"></script>
    <script src="./auth.js"></script>
    <link rel="stylesheet" href="./studio.css" />
    <link rel="stylesheet" href="./theme.css" />
  </head>
  <body>
    <div id="root">
      <div class="loading">
        <div>
          <strong>파코 스튜디오를 준비하고 있어요.</strong>
          <p id="boot-message">
            첫 방문에는 화면 구성 요소를 내려받습니다. 인터넷 연결을
            확인해주세요.
          </p>
          <a href="./new.html">화면 다시 불러오기</a>
        </div>
      </div>
    </div>
    <noscript
      >파코 스튜디오는 JavaScript가 필요합니다. 브라우저 설정에서 JavaScript를
      허용해주세요.</noscript
    >
    <script>
      window.addEventListener("error", function (event) {
        const message = document.getElementById("boot-message");
        if (message)
          message.textContent =
            "화면을 불러오지 못했습니다. 인터넷 연결 또는 CDN 접근 설정을 확인한 후 새로고침해주세요.";
      });
      window.addEventListener("unhandledrejection", function () {
        const message = document.getElementById("boot-message");
        if (message)
          message.textContent =
            "화면 구성 요소를 불러오지 못했습니다. 인터넷 연결 또는 CDN 접근 설정을 확인해주세요.";
      });
    </script>
    <script type="importmap">
      {
        "imports": {
          "react": "https://esm.sh/react@18.3.1",
          "react-dom/client": "https://esm.sh/react-dom@18.3.1/client?deps=react@18.3.1",
          "@radix-ui/react-tabs": "https://esm.sh/@radix-ui/react-tabs@1.1.3?deps=react@18.3.1,react-dom@18.3.1",
          "@radix-ui/react-dialog": "https://esm.sh/@radix-ui/react-dialog@1.1.6?deps=react@18.3.1,react-dom@18.3.1",
          "class-variance-authority": "https://esm.sh/class-variance-authority@0.7.1",
          "lucide-react": "https://esm.sh/lucide-react@0.468.0?deps=react@18.3.1"
        }
      }
    </script>
    <script id="worker-source" type="text/plain">
          import { loadPyodide } from "https://cdn.jsdelivr.net/pyodide/v0.27.7/full/pyodide.mjs";
          try {
            const pyodide = await loadPyodide({
              indexURL: "https://cdn.jsdelivr.net/pyodide/v0.27.7/full/",
            });
            pyodide.runPython(`
      import io, sys, json, traceback, contextlib

      class _LimitedOutput(io.StringIO):
          def write(self, text):
              if self.tell() + len(text) > 20000:
                  raise RuntimeError("출력이 너무 많아요. 출력은 20,000자까지 가능합니다.")
              return super().write(text)

      def _execute_student(source, stdin):
          output = _LimitedOutput()
          errors = _LimitedOutput()
          previous_stdin = sys.stdin
          error = None
          try:
              sys.stdin = io.StringIO(stdin)
              with contextlib.redirect_stdout(output), contextlib.redirect_stderr(errors):
                  exec(compile(source, "solution.py", "exec"), {"__name__": "__main__"})
          except BaseException:
              error = traceback.format_exc(limit=5)[-4000:]
          finally:
              sys.stdin = previous_stdin
          return json.dumps({"output": output.getvalue(), "stderr": errors.getvalue(), "error": error})
            `);
            self.onmessage = ({ data }) => {
              try {
                pyodide.globals.set("_student_source", data.code);
                pyodide.globals.set("_student_stdin", data.input);
                const result = JSON.parse(pyodide.runPython("_execute_student(_student_source, _student_stdin)"));
                self.postMessage({ type: "result", ...result });
              } catch (error) {
                self.postMessage({ type: "fatal", error: error.message });
              }
            };
            self.postMessage({ type: "ready" });
          } catch (error) {
            self.postMessage({ type: "fatal", error: "Python을 불러오지 못했어요. 인터넷 연결과 CDN 접근을 확인해주세요.\n" + error.message });
          }
    </script>
    <!-- 문제 목록은 studio-catalog.js에서, 문제 본문은 curriculum/step-NN/<문제ID>.json에서 필요할 때 불러옵니다. -->
    <script src="./studio-catalog.js"></script>
    <script src="./studio-core.js"></script>
    <script>
      // 첫 화면의 문제 파일은 화면 라이브러리를 내려받는 동안 미리 요청합니다.
      loadProblem(startupProblemId(location.search)).catch(function () {});
    </script>
    <script type="module" src="./studio-app.js"></script>
  </body>
</html>
