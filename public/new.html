<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f6f7f9" />
    <link rel="manifest" href="./manifest.json" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <script>
      if ("serviceWorker" in navigator)
        window.addEventListener("load", () =>
          navigator.serviceWorker.register("./sw.js").catch(() => {}),
        );
    </script>
    <title>파코 스튜디오 · 나의 첫 Python</title>
    <script src="./auth.js"></script>
    <style>
      :root {
        --background: #fff;
        --foreground: #20252d;
        --primary: #19705b;
        --primary-foreground: #fff;
        --muted: #f4f5f7;
        --muted-foreground: #7b818d;
        --border: #e7e9ee;
        --ring: #19705b;
        --radius: 12px;
        font-family:
          Inter,
          "Pretendard",
          "Noto Sans KR",
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        color: var(--foreground);
        font-size: 14px;
        background: #f6f7f9;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
      }
      button,
      input,
      textarea,
      select {
        font: inherit;
      }
      button {
        cursor: pointer;
      }
      button:disabled {
        cursor: not-allowed;
      }
      a {
        color: inherit;
      }
      button,
      a,
      input,
      textarea,
      select {
        outline-offset: 4px;
      }
      button:focus-visible,
      a:focus-visible,
      input:focus-visible,
      textarea:focus-visible,
      select:focus-visible {
        outline: 2px solid var(--ring);
      }
      button:disabled {
        opacity: 0.5;
      }
      svg {
        width: 18px;
        height: 18px;
        flex-shrink: 0;
        vertical-align: middle;
      }
      h1,
      h2,
      h3,
      p {
        margin: 0;
      }
      button {
        color: inherit;
      }
      pre,
      code,
      textarea.editor {
        font-family: "Cascadia Code", "SFMono-Regular", Consolas, monospace;
      }
      pre {
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      code {
        font-size: 0.92em;
      }
      button {
        transition:
          background 0.15s,
          box-shadow 0.15s;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 7px;
        white-space: nowrap;
        border: 1px solid transparent;
        border-radius: 7px;
        font-size: 12px;
        font-weight: 600;
        height: 34px;
        padding: 0 12px;
      }
      .btn-primary {
        background: var(--primary);
        color: white;
      }
      .btn-primary:hover {
        background: #145b4a;
      }
      .btn-outline {
        background: #fff;
        border-color: var(--border);
      }
      .btn-outline:hover,
      .btn-ghost:hover {
        background: #f0f3f5;
      }
      .btn-ghost {
        background: transparent;
      }
      .btn-small {
        height: 29px;
        font-size: 11px;
        padding: 0 9px;
      }
      .btn-icon {
        width: 32px;
        padding: 0;
      }
      .badge {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        border-radius: 5px;
        font-size: 10px;
        font-weight: 600;
        padding: 4px 7px;
        background: #edf6f1;
        color: #247358;
      }
      .muted {
        color: var(--muted-foreground);
      }
      .tiny {
        font-size: 11px;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 9px;
      }
      .spread {
        justify-content: space-between;
      }
      .grow {
        flex: 1;
        min-width: 0;
      }
      .divider {
        height: 20px;
        width: 1px;
        background: var(--border);
        margin: 0 5px;
      }
      .shell {
        min-height: 100vh;
        display: grid;
        grid-template-columns: 74px minmax(0, 1fr);
      }
      .rail {
        background: white;
        border-right: 1px solid var(--border);
        display: flex;
        align-items: center;
        flex-direction: column;
        gap: 20px;
        padding: 23px 10px;
        position: sticky;
        top: 0;
        height: 100vh;
      }
      .brand-icon {
        width: 36px;
        height: 36px;
        display: grid;
        place-items: center;
        background: var(--primary);
        color: white;
        border-radius: 12px;
        font-size: 22px;
        font-weight: 800;
        box-shadow: 0 4px 9px #19705b20;
      }
      .rail-nav {
        display: flex;
        flex-direction: column;
        gap: 12px;
        width: 100%;
        margin-top: 20px;
      }
      .rail-button {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
        border: 0;
        background: transparent;
        padding: 12px 0;
        border-radius: 10px;
        color: #8b919d;
        font-size: 10px;
        text-decoration: none;
      }
      .rail-button.active {
        background: #eaf4ef;
        color: var(--primary);
        font-weight: 700;
      }
      .rail-bottom {
        margin-top: auto;
      }
      .avatar {
        width: 31px;
        height: 31px;
        border-radius: 50%;
        background: #e9e7fa;
        color: #7060a5;
        display: grid;
        place-items: center;
        font-size: 11px;
        font-weight: 700;
      }
      .main {
        min-width: 0;
      }
      .topbar {
        height: 70px;
        background: #ffffffc9;
        border-bottom: 1px solid var(--border);
        padding: 0 27px;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .wordmark {
        font-size: 19px;
        font-weight: 850;
        letter-spacing: -1px;
      }
      .wordmark span {
        font-size: 11px;
        letter-spacing: 1.6px;
        color: #969ca5;
        font-weight: 500;
        margin-left: 10px;
      }
      .top-right {
        display: flex;
        align-items: center;
        gap: 15px;
        font-size: 11px;
        color: #7a818c;
      }
      .local-dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #4b9d7c;
        display: inline-block;
        margin-right: 5px;
      }
      .workspace {
        padding: 23px 25px 16px;
        max-width: 1920px;
        margin: auto;
      }
      .breadcrumb {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 11px;
        color: #8a919b;
        margin-bottom: 19px;
      }
      .breadcrumb svg {
        width: 13px;
        height: 13px;
      }
      .breadcrumb strong {
        color: #5d6570;
        font-weight: 500;
      }
      .heading {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 15px;
        margin-bottom: 20px;
      }
      .eyebrow {
        color: var(--primary);
        font-size: 10px;
        letter-spacing: 1.4px;
        font-weight: 750;
        margin-bottom: 7px;
      }
      .heading h1 {
        font-size: 25px;
        letter-spacing: -1px;
        line-height: 1.4;
      }
      .heading p {
        color: #9298a2;
        font-size: 12px;
        margin-top: 8px;
      }
      .heading-actions {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-top: 9px;
      }
      .progress-pill {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 11px;
        padding: 8px 12px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: #fff;
      }
      .progress-track {
        width: 65px;
        height: 4px;
        background: #edf0f2;
        border-radius: 5px;
        overflow: hidden;
      }
      .progress-fill {
        background: var(--primary);
        height: 100%;
        transition: width 0.3s;
      }
      .lesson-bar {
        display: flex;
        align-items: center;
        gap: 14px;
        margin-bottom: 17px;
        border: 1px solid var(--border);
        background: white;
        padding: 11px 14px;
        border-radius: 10px;
      }
      .track-select {
        border: 0;
        background: #f1f5f3;
        color: #366b58;
        border-radius: 6px;
        padding: 7px 10px;
        font-size: 11px;
        font-weight: 650;
        max-width: 160px;
      }
      .step-list {
        display: flex;
        align-items: center;
        gap: 7px;
        flex: 1;
        min-width: 0;
      }
      .step {
        display: flex;
        align-items: center;
        gap: 7px;
        padding: 6px 9px;
        background: none;
        border: 0;
        border-radius: 7px;
        color: #9096a0;
        font-size: 11px;
        text-align: left;
      }
      .step.current {
        color: #276a55;
        background: #eef6f1;
        font-weight: 600;
      }
      .step-number {
        width: 23px;
        height: 23px;
        border: 1px solid #e4e7ec;
        border-radius: 50%;
        display: grid;
        place-items: center;
        font-size: 10px;
        background: white;
        flex-shrink: 0;
      }
      .current .step-number {
        background: var(--primary);
        color: white;
        border-color: var(--primary);
      }
      .step-number.done {
        color: var(--primary);
        background: #e6f4eb;
      }
      .step-number svg {
        width: 13px;
        height: 13px;
      }
      .step-link {
        height: 1px;
        background: #e6e9ed;
        width: 20px;
        flex-shrink: 0;
      }
      .panels {
        display: grid;
        grid-template-columns:
          minmax(275px, 0.98fr) minmax(360px, 1.3fr)
          minmax(285px, 0.92fr);
        gap: 14px;
        align-items: stretch;
        min-height: 670px;
        height: calc(100vh - 307px);
      }
      .panel {
        background: #fff;
        border: 1px solid var(--border);
        border-radius: 11px;
        min-width: 0;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        box-shadow: 0 2px 3px #1c273503;
      }
      .panel-head {
        height: 48px;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 0 16px;
        border-bottom: 1px solid var(--border);
        font-size: 12px;
        font-weight: 650;
        flex-shrink: 0;
      }
      .panel-head svg {
        width: 15px;
        height: 15px;
        color: #89929b;
      }
      .panel-head .badge {
        margin-left: auto;
        font-size: 9px;
      }
      .tabs {
        display: flex;
        flex-direction: column;
        flex: 1;
        min-height: 0;
      }
      .tab-list {
        display: flex;
        align-items: center;
        gap: 18px;
        border-bottom: 1px solid var(--border);
        padding: 0 18px;
        min-height: 43px;
        flex-shrink: 0;
      }
      .tab-trigger {
        background: none;
        border: 0;
        border-bottom: 2px solid transparent;
        align-self: stretch;
        padding: 0 0;
        font-size: 11px;
        color: #9298a1;
      }
      .tab-trigger[data-state="active"] {
        border-bottom-color: var(--primary);
        color: var(--primary);
        font-weight: 650;
      }
      .tab-content {
        overflow: auto;
        flex: 1;
        min-height: 0;
        padding: 24px 21px;
      }
      .tab-content[data-state="inactive"] {
        display: none;
      }
      .problem-number {
        font-size: 10px;
        color: #9da3ac;
        letter-spacing: 1px;
        margin-bottom: 9px;
      }
      .problem-title {
        font-size: 21px;
        letter-spacing: -0.7px;
        line-height: 1.4;
        margin-bottom: 12px;
      }
      .problem-meta {
        display: flex;
        gap: 7px;
        align-items: center;
        margin-bottom: 24px;
      }
      .tag {
        padding: 4px 7px;
        border-radius: 4px;
        font-size: 10px;
        color: #858b95;
        background: #f5f6f8;
      }
      .section-title {
        font-size: 12px;
        font-weight: 700;
        margin: 23px 0 11px;
      }
      .prose {
        font-size: 12px;
        line-height: 1.95;
        color: #69717d;
        word-break: keep-all;
      }
      .prose p + p {
        margin-top: 9px;
      }
      .concept-callout {
        display: flex;
        gap: 9px;
        padding: 12px;
        border: 1px solid #e9e5fc;
        background: #f8f6ff;
        border-radius: 8px;
        font-size: 11px;
        color: #7b6ba3;
        margin-top: 18px;
        line-height: 1.8;
      }
      .concept-callout svg {
        width: 15px;
        height: 15px;
        margin-top: 3px;
      }
      .io-card {
        border: 1px solid var(--border);
        border-radius: 8px;
        margin-top: 10px;
        overflow: hidden;
      }
      .io-head {
        background: #fafbfc;
        display: flex;
        justify-content: space-between;
        padding: 9px 12px;
        border-bottom: 1px solid var(--border);
        font-size: 10px;
        color: #8a919b;
      }
      .io-body {
        display: grid;
        grid-template-columns: 1fr 1fr;
      }
      .io-col {
        padding: 11px 12px;
        min-width: 0;
      }
      .io-col + .io-col {
        border-left: 1px solid var(--border);
      }
      .io-col label {
        display: block;
        color: #9a9fa7;
        font-size: 10px;
        margin-bottom: 8px;
      }
      .io-col pre {
        font-size: 11px;
        line-height: 1.6;
        margin: 0;
        color: #58626c;
        min-height: 17px;
      }
      .constraint-list {
        padding-left: 17px;
        color: #79818b;
        font-size: 11px;
        line-height: 1.9;
      }
      .problem-footer {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 11px 15px;
        border-top: 1px solid var(--border);
        font-size: 10px;
        color: #959ca5;
      }
      .problem-footer .btn {
        font-size: 10px;
      }
      .concept-code {
        padding: 15px;
        background: #f5f7f8;
        border: 1px solid var(--border);
        border-radius: 8px;
        font-size: 12px;
        line-height: 1.8;
      }
      .hint {
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 12px;
        margin-bottom: 10px;
        font-size: 12px;
        line-height: 1.8;
      }
      .hint summary {
        cursor: pointer;
        font-weight: 600;
      }
      .hint p {
        color: #7c8490;
        margin-top: 10px;
      }
      .editor-toolbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        height: 43px;
        padding: 0 13px;
        border-bottom: 1px solid var(--border);
        background: #fcfcfd;
        font-size: 10px;
        color: #858d97;
      }
      .language {
        display: flex;
        align-items: center;
        gap: 6px;
        color: #4a5863;
      }
      .python-logo {
        color: #4288ad;
        font-weight: bold;
        font-family: monospace;
        font-size: 12px;
      }
      .code-wrap {
        position: relative;
        display: flex;
        flex: 1;
        min-height: 210px;
        background: #fff;
        overflow: hidden;
      }
      .line-numbers {
        margin: 0;
        padding: 21px 0 20px;
        width: 43px;
        flex-shrink: 0;
        text-align: right;
        font-size: 12px;
        line-height: 23px;
        color: #b8bec7;
        background: #fdfdfe;
        overflow: hidden;
        user-select: none;
        white-space: pre;
      }
      .editor {
        resize: none;
        border: 0;
        border-radius: 0;
        padding: 21px 18px 20px 14px;
        width: 100%;
        height: 100%;
        min-height: 210px;
        line-height: 23px;
        font-size: 12px;
        color: #344d69;
        background: transparent;
        tab-size: 4;
        white-space: pre;
        overflow: auto;
        outline: none !important;
        caret-color: #19705b;
      }
      .editor:focus {
        box-shadow: inset 0 0 0 2px #19705b22;
      }
      .editor-status {
        display: flex;
        justify-content: space-between;
        font-size: 9px;
        color: #a1a7b0;
        border-top: 1px solid #f1f2f5;
        padding: 7px 13px;
      }
      .runner {
        height: 246px;
        border-top: 1px solid var(--border);
        display: flex;
        flex-direction: column;
        flex-shrink: 0;
      }
      .runner .tab-list {
        min-height: 39px;
        gap: 20px;
      }
      .runner .tab-content {
        padding: 13px 15px;
      }
      .input-label {
        font-size: 10px;
        color: #969da7;
        margin-bottom: 8px;
      }
      .stdin {
        width: 100%;
        resize: vertical;
        min-height: 80px;
        max-height: 140px;
        border: 1px solid #e9ecf0;
        border-radius: 6px;
        padding: 10px;
        background: #fafbfc;
        font-family: Consolas, monospace;
        font-size: 12px;
        color: #65707c;
      }
      .input-note {
        font-size: 10px;
        color: #a0a6af;
        margin-top: 8px;
      }
      .output {
        font-size: 11px;
        line-height: 1.8;
        margin: 0;
        color: #53616c;
      }
      .output.error {
        color: #b24d4d;
      }
      .empty-result {
        height: 130px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 10px;
        color: #a4aab2;
        font-size: 11px;
      }
      .empty-result svg {
        width: 25px;
        height: 25px;
        color: #bec6ce;
      }
      .result-head {
        font-size: 12px;
        font-weight: 650;
        margin-bottom: 10px;
        display: flex;
        align-items: center;
        gap: 7px;
      }
      .result-pass {
        color: #19705b;
      }
      .result-fail {
        color: #be5959;
      }
      .case-row {
        padding: 8px 0;
        border-bottom: 1px solid #f0f1f3;
        font-size: 10px;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .case-row details {
        width: 100%;
        font-size: 11px;
      }
      .case-row summary {
        cursor: pointer;
      }
      .case-detail {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        margin-top: 9px;
        color: #7e8791;
      }
      .case-detail pre {
        background: #f8f9fb;
        padding: 8px;
        margin: 5px 0;
        font-size: 10px;
      }
      .execution-bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 7px;
        border-top: 1px solid var(--border);
        padding: 12px 13px;
        background: #fdfefe;
      }
      .execution-note {
        font-size: 9px;
        color: #9aa3ae;
      }
      .execution-buttons {
        display: flex;
        gap: 7px;
      }
      .execution-buttons svg {
        width: 13px;
        height: 13px;
      }
      .coach-label {
        background: #f0eefb;
        color: #8572bd;
      }
      .coach-body {
        padding: 20px 18px;
        display: flex;
        flex-direction: column;
        flex: 1;
        min-height: 0;
        overflow: auto;
      }
      .coach-greeting {
        border: 1px solid #eeebf7;
        background: linear-gradient(145deg, #faf9ff, #f7f9fc);
        border-radius: 10px;
        padding: 18px 15px;
        margin-bottom: 18px;
      }
      .coach-avatar {
        width: 37px;
        height: 37px;
        display: grid;
        place-items: center;
        background: #ebe6f8;
        color: #8e77bd;
        border-radius: 12px;
        margin-bottom: 15px;
      }
      .coach-avatar svg {
        width: 22px;
        height: 22px;
      }
      .coach-greeting h3 {
        font-size: 15px;
        letter-spacing: -0.5px;
        margin-bottom: 8px;
      }
      .coach-greeting p {
        color: #92909f;
        line-height: 1.9;
        font-size: 11px;
      }
      .coach-section-label {
        font-size: 10px;
        color: #a0a4ad;
        letter-spacing: 0.3px;
        margin: 2px 0 11px;
      }
      .prompt-button {
        display: flex;
        gap: 10px;
        align-items: center;
        text-align: left;
        border: 1px solid var(--border);
        background: white;
        border-radius: 8px;
        padding: 12px 11px;
        width: 100%;
        font-size: 11px;
        color: #737b87;
        margin-bottom: 8px;
      }
      .prompt-button:hover {
        border-color: #b9d5c8;
        background: #fbfdfc;
      }
      .prompt-button svg {
        width: 14px;
        height: 14px;
        color: #aaa5be;
      }
      .prompt-button svg:last-child {
        margin-left: auto;
        width: 12px;
      }
      .coach-bottom {
        margin-top: auto;
        padding-top: 20px;
      }
      .coach-note {
        display: flex;
        gap: 8px;
        background: #f7f8fa;
        border-radius: 8px;
        padding: 11px;
        color: #9a9fab;
        font-size: 10px;
        line-height: 1.8;
        margin-bottom: 13px;
      }
      .coach-note svg {
        width: 13px;
        height: 13px;
        margin-top: 3px;
      }
      .wide {
        width: 100%;
      }
      .coach-links {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: 8px;
      }

        "https://copilotstudio.microsoft.com/environments/9324e73a-cd4e-e049-b7ba-177af6165e9c/bots/crbf2_agent_dKZZIw/webchat?__version__=2&enableFileAttachment=false&cliAgent=true";

        return value
          .replace(/\r\n/g, "\n")
          .split("\n")
          .map((line) => line.trimEnd())
          .join("\n")
          .replace(/\n+$/, "");
      }
      function validateCoachUrl(value) {
        const url = new URL(value.trim());

          throw new Error("인증 정보가 없는 HTTPS 주소를 입력해주세요.");

            url.hostname.endsWith(".api.powerplatform.com") ||

        ) {

      function readCookie(cookies, name) {
        const part = cookies
          .split(";")
          .map((value) => value.trim())
          .find((value) => value.startsWith(name + "="));
        if (!part) return "";
        try {
          return decodeURIComponent(part.slice(name.length + 1));
        } catch {
          return "";
        }
      }
      // 로그인 때 저장한 쿠키(school, studentId, studentName)를 사용합니다. 이름 쿠키가 없는 이전 로그인은 /api/session으로 보완합니다.
      async function loadStudent(fetchImpl, cookies) {
        const school = readCookie(cookies, "school");
        const studentId = readCookie(cookies, "studentId");
        let studentName = readCookie(cookies, "studentName");
        if (!studentName) {
          const response = await fetchImpl("/api/session", {
            credentials: "same-origin",
            cache: "no-store",
          }).catch(() => null);
          const body =
            response && response.ok
              ? await response.json().catch(() => null)
              : null;
          if (
            body &&
            body.authenticated === true &&
            body.school === school &&
            typeof body.name === "string"
          ) {
            studentName = body.name;
          }
        }
        if (
          !school ||
          !/^[0-9]{1,32}$/.test(studentId) ||
          studentName.length > 100 ||
          !/^\p{L}[\p{L}\p{M}]*$/u.test(studentName)
        ) {
          throw new Error(
            "로그인한 학생 정보를 확인할 수 없어요. 로그아웃 후 다시 로그인해주세요.",
          );
        }
        return { school, studentId, studentName };
      }
      // 흐름은 { updated: true, points: <새 누적 점수> }를 반환합니다. 학생을 찾지 못하면 404입니다.
      async function requestPoints({
        url,
        student,
        problemId,
        points,
        fetchImpl,
        timeoutMs = 15000,
      }) {
        const response = await fetchImpl(validatePointsUrl(url), {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            school: student.school,
            studentId: student.studentId,
            studentName: student.studentName,
            problemId,
            points,
          }),
          cache: "no-store",
          redirect: "error",
          signal: AbortSignal.timeout(timeoutMs),
        });
        if (response.status === 404)
          throw new Error(
            "활성 학생 기록을 찾을 수 없어요. 학교·학번·이름을 확인해주세요.",
          );
        if (!response.ok)
          throw new Error(
            "포인트 적립 흐름 실행에 실패했어요. (" + response.status + ")",
          );
        const result = await response.json().catch(() => null);
        if (
          !result ||
          result.updated !== true ||
          !Number.isSafeInteger(result.points) ||
          result.points < 0
        ) {
          throw new Error("포인트 적립 응답 형식이 올바르지 않아요.");
        }
        return { points: result.points, awarded: result.awarded !== false };
      }
      function readStudioState(storage) {
        const initial = {
          selected: "hello",
          codes: {},
          completed: [],
          coachUrl: DEFAULT_COACH_URL,
          pointsUrl: "",
          awarded: [],
        };
        try {
          const raw = storage.getItem(STORAGE_KEY);
          if (!raw) return { state: initial, warning: "" };
          const parsed = JSON.parse(raw);
          if (
            !parsed ||
            typeof parsed !== "object" ||
            Array.isArray(parsed) ||
            typeof parsed.codes !== "object" ||
            !parsed.codes ||
            Array.isArray(parsed.codes) ||
            !Array.isArray(parsed.completed) ||
            !PROBLEMS.some((p) => p.id === parsed.selected) ||
            typeof parsed.coachUrl !== "string"
          )
            throw new Error("저장 형식이 올바르지 않아요.");
          const codes = {};
          for (const [id, code] of Object.entries(parsed.codes)) {
            if (!PROBLEMS.some((p) => p.id === id) || typeof code !== "string")
              throw new Error("저장된 코드 형식이 올바르지 않아요.");
            codes[id] = code;
          }
          if (
            !parsed.completed.every((id) => PROBLEMS.some((p) => p.id === id))

            throw new Error("저장된 진도가 올바르지 않아요.");
          const pointsUrl =
            typeof parsed.pointsUrl === "string" && parsed.pointsUrl
              ? validatePointsUrl(parsed.pointsUrl)
              : "";
          const awarded = Array.isArray(parsed.awarded)
            ? [
                ...new Set(
                  parsed.awarded.filter((key) => typeof key === "string"),
                ),
              ]
            : [];
          return {
            state: {
              selected: parsed.selected,
              codes,
              completed: [...new Set(parsed.completed)],
              coachUrl: validateCoachUrl(parsed.coachUrl),
              pointsUrl,
              awarded,
            },
            warning: "",
          };
        } catch (error) {
          return {

          };
        }
      }

        function stopJob(message) {
          if (job.current) {
            job.current.worker.terminate();
            clearTimeout(job.current.timer);
            job.current = null;
          }
          setBusy("");
          if (message) {
            setRunResult({ output: "", error: message });
            setGrade(null);
            setRunnerTab("output");
          }
        }

        function execute(mode) {
          if (job.current) return;
          setBusy("Python 준비 중…");
          setGrade(null);
          setRunResult(null);
          setElapsed(null);
          setRunnerTab(mode === "grade" ? "tests" : "output");
          const cases = mode === "grade" ? problem.tests : [{ input: stdin }];
          const results = [];
          let current = 0;
          let started;
          let worker;
          let workerUrl;
          try {
            workerUrl = URL.createObjectURL(
              new Blob([document.getElementById("worker-source").textContent], {
                type: "text/javascript",
              }),
            );
            worker = new Worker(workerUrl, { type: "module" });
          } catch (error) {
            setBusy("");
            setRunResult({
              output: "",
              error: "Python 실행기를 만들지 못했어요: " + error.message,
            });
            setRunnerTab("output");
            return;
          } finally {
            if (workerUrl) URL.revokeObjectURL(workerUrl);
          }
          const active = { worker, timer: null };
          job.current = active;
          function armTimeout(ms, message) {
            clearTimeout(active.timer);
            active.timer = setTimeout(() => stopJob(message), ms);
          }
          function sendCase() {
            setBusy(
              mode === "grade"
                ? `채점 중 ${current + 1}/${cases.length}`
                : "실행 중…",
            );
            armTimeout(
              5000,
              "실행 제한 시간(5초)을 초과했어요. 무한 반복이 있는지 확인해주세요.",
            );
            worker.postMessage({ code, input: cases[current].input });
          }
          armTimeout(
            90000,
            "Python을 90초 안에 불러오지 못했어요. 인터넷 연결을 확인한 후 다시 시도해주세요.",
          );
          worker.onerror = (event) => {
            event.preventDefault();
            if (job.current !== active) return;
            stopJob(
              "Python 실행기 오류: " +
                (event.message ||
                  "실행기를 불러올 수 없습니다. CDN 접근을 확인해주세요."),
            );
          };
          worker.onmessage = ({ data }) => {
            if (job.current !== active) return;
            if (data.type === "fatal") {
              stopJob(data.error);
              return;
            }
            if (data.type === "ready") {
              started = performance.now();
              sendCase();
              return;
            }
            if (data.type !== "result") return;
            const result = {
              ...data,
              input: cases[current].input,
              expected: cases[current].output,
            };
            result.passed =
              !result.error &&
              normalizeOutput(result.output) ===
                normalizeOutput(result.expected ?? "");
            results.push(result);
            current += 1;
            if (mode === "grade")
              setGrade({
                results: [...results],
                total: cases.length,
                finished: false,
              });
            if (current < cases.length) {
              sendCase();
              return;
            }
            setElapsed(Math.round(performance.now() - started));
            stopJob();
            if (mode === "run") setRunResult(result);
            else {
              const passed = results.every((item) => item.passed);
              setGrade({
                results,
                total: cases.length,
                finished: true,
                passed,
              });
              if (passed) {
                setState((previous) => ({
                  ...previous,
                  completed: [...new Set([...previous.completed, problem.id])],
                }));
                setToast("해결 완료! 한 걸음 더 성장했어요.");
                awardPoints(problem);
              }
            }
          };
        }
        // 제출 통과 시 브라우저가 Power Automate 흐름을 직접 호출합니다. 학생·문제당 한 번만 적립하며 기록은 이 브라우저에만 남습니다.
        async function awardPoints(solvedProblem) {
          const url = state.pointsUrl || DEFAULT_POINTS_URL;
          const points = pointsFor(solvedProblem);
          if (!url || !points) {
            if (!url)
              setToast(
                "해결 완료! 포인트 적립 주소가 설정되지 않았어요. 설정(톱니바퀴)에서 입력해주세요.",
              );
            return;
          }
          let key;
          try {
            const student = await loadStudent(fetch, document.cookie);
            key = awardKey(student, solvedProblem.id);
            if (state.awarded.includes(key) || awarding.current.has(key)) {
              setToast("이미 포인트를 받은 문제예요.");
              return;
            }
            awarding.current.add(key);
            const result = await requestPoints({
              url,
              student,
              problemId: solvedProblem.id,
              points,
              fetchImpl: fetch,
            });
            setState((previous) => ({
              ...previous,
              awarded: [...new Set([...previous.awarded, key])],
            }));
            setToast(
              result.awarded
                ? `해결 완료! +${points}점이 적립됐어요. (누적 ${result.points}점)`
                : `이미 포인트를 받은 문제예요. (누적 ${result.points}점)`,
            );
          } catch (error) {
            const network =
              error instanceof TypeError ||
              error.name === "TimeoutError" ||
              error.name === "AbortError";
            setToast(
              "해결은 저장했지만 포인트를 확인하지 못했어요. " +
                (network
                  ? "네트워크 연결이나 흐름 상태를 확인해주세요. 적립됐을 수 있으니 같은 문제를 반복 제출하지 마세요."
                  : error.message),
            );
          } finally {
            if (key) awarding.current.delete(key);
          }
        }
        async function copyPrompt(kind) {

            h(
              "p",
              { className: "prose" },
              "문제를 해결하면 이 브라우저가 위 흐름 주소로 학교·학번·이름과 포인트를 직접 보냅니다. 주소의 서명은 비밀이므로 다른 사람과 공유하지 마세요. 페이지는 AI API를 호출하지 않으며, 코치 대화는 외부 서비스의 정책을 따릅니다. 코치 화면이 차단되면 새 창으로 열어주세요.",
            ),
            h(
              "div",
              { className: "config-actions" },
              h(
                Button,
                {

                  onClick: () => setCoachDraft(DEFAULT_COACH_URL),

              h(Button, { onClick: saveCoach }, "주소 저장"),

          toast && h("div", { className: "toast", role: "status" }, toast),
        );

      createRoot(document.getElementById("root")).render(
        h(ErrorBoundary, null, h(App)),
      );
